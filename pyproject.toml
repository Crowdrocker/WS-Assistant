[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-assistant"
version = "0.1.0"
description = "A local-first modular desktop assistant for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See LICENSE" }
authors = [{ name = "Crowdrocker" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ws-assistant = "ws_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
